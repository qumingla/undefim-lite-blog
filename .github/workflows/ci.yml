name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      # 隔离空库，不读取任何正式数据
      DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: undefim-blog:ci
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test isolated container and restart
        run: |
          docker volume create blog-update-ci-data
          docker run -d --name blog-update-ci --env COOKIE_SECURE=false --volume blog-update-ci-data:/app/data undefim-blog:ci
          docker exec -e CONTAINER_SMOKE_TEST=true -e EXPECTED_REVISION=${{ github.sha }} blog-update-ci node scripts/verify-container.mjs
          docker restart blog-update-ci
          docker exec -e CONTAINER_SMOKE_TEST=true -e EXPECTED_REVISION=${{ github.sha }} blog-update-ci node scripts/verify-container.mjs
      - name: Clean isolated container data
        if: always()
        run: |
          docker rm -f blog-update-ci || true
          docker volume rm blog-update-ci-data || true

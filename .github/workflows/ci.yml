name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      # 隔离空库，不读取任何正式数据
      DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: undefim-blog:ci
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.updater
          push: false
          load: true
          tags: undefim-blog-updater:ci
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max
      - name: Smoke test isolated Compose services and recovery
        env:
          COMPOSE_SMOKE_TEST: true
          EXPECTED_REVISION: ${{ github.sha }}
        run: sh scripts/verify-compose.sh

# Oracle Ubuntu Nginx 1.18. Install as /etc/nginx/conf.d/undefim-blog.conf.
# Uses the existing, verified certificate in the domain-specific ssl directory.
server {
    listen 80;
    listen [::]:80;
    server_name undefi.me;
    location ^~ /.well-known/acme-challenge/ { root /var/www/undefim-acme; }
    location / { return 308 https://undefi.me$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name undefi.me;
    ssl_certificate /etc/nginx/ssl/undefi.me/undefi.me.cer;
    ssl_certificate_key /etc/nginx/ssl/undefi.me/undefi.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 42m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    access_log /var/log/nginx/undefim-blog.access.log;
    error_log /var/log/nginx/undefim-blog.error.log;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host undefi.me;
    proxy_set_header X-Forwarded-Host undefi.me;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    location / { proxy_pass http://127.0.0.1:4322; }
    location ~ ^/(admin|api)(/|$) {
        proxy_pass http://127.0.0.1:4322;
        proxy_cache off;
    }
}

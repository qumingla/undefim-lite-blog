# Install only after preview acceptance. Preserve the existing Nginx sites.
# Obtain the certificate before enabling the HTTPS server block.
server {
    listen 80;
    server_name undefi.me;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name undefi.me;
    ssl_certificate /etc/letsencrypt/live/undefi.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/undefi.me/privkey.pem;
    client_max_body_size 40m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location ~ ^/(admin|api)(/|$) {
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
}
